<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="860" viewBox="0 0 1200 860">
  <defs>
    <style>
      .title { font: 700 30px "PingFang SC", "Microsoft YaHei", Arial, sans-serif; fill: #172033; }
      .subtitle { font: 500 15px "PingFang SC", "Microsoft YaHei", Arial, sans-serif; fill: #526070; }
      .label { font: 700 17px "PingFang SC", "Microsoft YaHei", Arial, sans-serif; fill: #172033; }
      .text { font: 500 13px "PingFang SC", "Microsoft YaHei", Arial, sans-serif; fill: #445166; }
      .tiny { font: 500 12px "PingFang SC", "Microsoft YaHei", Arial, sans-serif; fill: #5a687c; }
      .state { fill: #eef4ff; stroke: #6d8fd6; stroke-width: 1.8; }
      .record { fill: #fff9ef; stroke: #c17919; stroke-width: 1.7; }
      .group { fill: #f8fafc; stroke: #9aa9bb; stroke-width: 1.6; }
      .legal { fill: #edf8f1; stroke: #2f7d51; stroke-width: 1.9; }
      .reduce { fill: #f7f2ff; stroke: #7b61c9; stroke-width: 1.9; }
      .edge { stroke: #34445c; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .soft { stroke: #9aa9bb; stroke-width: 1.6; fill: none; marker-end: url(#arrow-soft); stroke-dasharray: 6 6; }
      .divider { stroke: #d8e0ea; stroke-width: 1.2; }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9.5" refY="6" orient="auto">
      <path d="M1,1 L11,6 L1,11 Z" fill="#34445c"/>
    </marker>
    <marker id="arrow-soft" markerWidth="12" markerHeight="12" refX="9.5" refY="6" orient="auto">
      <path d="M1,1 L11,6 L1,11 Z" fill="#9aa9bb"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="860" fill="#ffffff"/>
  <text x="58" y="58" class="title">单轮 MapReduce 细化图</text>
  <text x="58" y="86" class="subtitle">示例：当前处理 row = r；Map 对当前行候选位置做映射，Shuffle 必须真实按 key 分组，Reduce 聚合得到首个完整解</text>

  <line x1="330" y1="120" x2="330" y2="775" class="divider"/>
  <line x1="610" y1="120" x2="610" y2="775" class="divider"/>
  <line x1="890" y1="120" x2="890" y2="775" class="divider"/>

  <text x="92" y="135" class="label">1. 输入 Frontier</text>
  <text x="385" y="135" class="label">2. Map：映射候选位置</text>
  <text x="662" y="135" class="label">3. Shuffle：真实按 key 分组</text>
  <text x="942" y="135" class="label">4. Reduce：生成结果</text>

  <rect x="70" y="175" width="215" height="92" rx="8" class="state"/>
  <text x="92" y="206" class="label">S0</text>
  <text x="92" y="231" class="text">row = r</text>
  <text x="92" y="251" class="tiny">columns = [0, 4, ...]</text>

  <rect x="70" y="310" width="215" height="92" rx="8" class="state"/>
  <text x="92" y="341" class="label">S1</text>
  <text x="92" y="366" class="text">row = r</text>
  <text x="92" y="386" class="tiny">columns = [1, 3, ...]</text>

  <rect x="70" y="445" width="215" height="92" rx="8" class="state"/>
  <text x="92" y="476" class="label">S2</text>
  <text x="92" y="501" class="text">row = r</text>
  <text x="92" y="521" class="tiny">columns = [2, 5, ...]</text>

  <rect x="370" y="168" width="200" height="54" rx="7" class="record"/>
  <text x="392" y="201" class="text">S0, col 0 → COLUMN</text>
  <rect x="370" y="234" width="200" height="54" rx="7" class="legal"/>
  <text x="392" y="267" class="text">S0, col 1 → LEGAL</text>
  <rect x="370" y="300" width="200" height="54" rx="7" class="record"/>
  <text x="392" y="333" class="text">S0, col 2 → DIAG1</text>

  <rect x="370" y="390" width="200" height="54" rx="7" class="record"/>
  <text x="392" y="423" class="text">S1, col 0 → DIAG2</text>
  <rect x="370" y="456" width="200" height="54" rx="7" class="legal"/>
  <text x="392" y="489" class="text">S1, col 1 → LEGAL</text>
  <rect x="370" y="522" width="200" height="54" rx="7" class="record"/>
  <text x="392" y="555" class="text">S1, col 2 → COLUMN</text>

  <rect x="370" y="612" width="200" height="54" rx="7" class="record"/>
  <text x="392" y="645" class="text">S2, col 0 → DIAG1</text>
  <rect x="370" y="678" width="200" height="54" rx="7" class="legal"/>
  <text x="392" y="711" class="text">S2, col 1 → LEGAL</text>

  <path d="M285 221 L368 194" class="edge"/>
  <path d="M285 221 L368 260" class="edge"/>
  <path d="M285 221 L368 326" class="edge"/>
  <path d="M285 356 L368 417" class="edge"/>
  <path d="M285 356 L368 483" class="edge"/>
  <path d="M285 356 L368 549" class="edge"/>
  <path d="M285 491 L368 639" class="edge"/>
  <path d="M285 491 L368 705" class="edge"/>

  <rect x="650" y="175" width="205" height="112" rx="8" class="legal"/>
  <text x="675" y="207" class="label">LEGAL</text>
  <text x="675" y="233" class="text">[S0-col1, S1-col1,</text>
  <text x="675" y="254" class="text"> S2-col1, ...]</text>

  <rect x="650" y="330" width="205" height="92" rx="8" class="group"/>
  <text x="675" y="361" class="label">COLUMN_CONFLICT</text>
  <text x="675" y="386" class="text">[S0-col0, S1-col2, ...]</text>

  <rect x="650" y="460" width="205" height="92" rx="8" class="group"/>
  <text x="675" y="491" class="label">DIAG1_CONFLICT</text>
  <text x="675" y="516" class="text">[S0-col2, S2-col0, ...]</text>

  <rect x="650" y="590" width="205" height="92" rx="8" class="group"/>
  <text x="675" y="621" class="label">DIAG2_CONFLICT</text>
  <text x="675" y="646" class="text">[S1-col0, ...]</text>

  <path d="M570 261 C600 245 615 235 648 231" class="edge"/>
  <path d="M570 483 C600 405 615 268 648 242" class="edge"/>
  <path d="M570 705 C600 600 615 270 648 252" class="edge"/>
  <path d="M570 194 C608 220 620 335 648 372" class="soft"/>
  <path d="M570 549 C608 535 622 415 648 387" class="soft"/>
  <path d="M570 326 C604 360 620 472 648 501" class="soft"/>
  <path d="M570 639 C604 615 620 536 648 520" class="soft"/>
  <path d="M570 417 C606 445 622 580 648 627" class="soft"/>

  <rect x="930" y="175" width="220" height="130" rx="8" class="reduce"/>
  <text x="958" y="207" class="label">Next Frontier</text>
  <text x="958" y="233" class="text">LEGAL 组按 order 排序</text>
  <text x="958" y="256" class="text">得到 row = r + 1 的状态</text>
  <text x="958" y="279" class="tiny">未放满 N 行，继续下一轮</text>

  <rect x="930" y="380" width="220" height="130" rx="8" class="reduce"/>
  <text x="958" y="412" class="label">First Solution</text>
  <text x="958" y="438" class="text">若候选已放满 N 行</text>
  <text x="958" y="461" class="text">聚合得到首个完整解</text>
  <text x="958" y="484" class="tiny">保证五种架构首解一致</text>

  <path d="M855 231 L928 240" class="edge"/>
  <path d="M1039 307 C1039 335 1039 350 1039 378" class="soft"/>

  <rect x="70" y="705" width="255" height="86" rx="8" fill="#f8fafc" stroke="#c8d2df" stroke-width="1.4"/>
  <text x="94" y="735" class="label">候选顺序</text>
  <text x="94" y="760" class="tiny">order = parentOrder × N + col</text>
  <text x="94" y="779" class="tiny">Reducer 用它恢复 row/col 搜索顺序</text>

  <rect x="650" y="725" width="500" height="66" rx="8" fill="#172033"/>
  <text x="675" y="754" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="14" font-weight="600" fill="#ffffff">
    冲突组不是最终答案来源，但必须真实形成，证明 Shuffle 阶段不是空壳。
  </text>
  <text x="675" y="776" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="13" fill="#dfe7f1">
    本图是单机模拟 MapReduce，不要求也不鼓励部署 Hadoop 集群。
  </text>
</svg>
